<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f766e">
  <title>冷蔵庫メモ</title>
  <style>
    :root {
      --bg: #f4f5f3;
      --card: #ffffff;
      --ink: #1c2421;
      --sub: #69756f;
      --line: #e6e8e5;
      --teal: #0f766e;
      --teal-soft: #d6efe9;
      --red: #d2453a;
      --red-soft: #fbe4e2;
      --amber: #c77b1a;
      --amber-soft: #fbeeda;
      --green: #3d8f54;
      --green-soft: #e1f0e4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
      line-height: 1.5;
      padding-bottom: 96px;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(244,245,243,0.92);
      backdrop-filter: blur(8px);
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    .title-row { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
    h1 .leaf { color: var(--teal); }
    .gear {
      background: none; border: none; font-size: 22px; cursor: pointer;
      color: var(--sub); padding: 4px; line-height: 1;
    }
    .summary { margin-top: 8px; font-size: 13px; color: var(--sub); }
    .summary b { color: var(--red); }

    main { padding: 14px 14px 0; }

    .filters { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
      color: var(--sub); border-radius: 999px; padding: 7px 14px; font-size: 13px;
      cursor: pointer; font-weight: 600;
    }
    .chip.active { background: var(--teal); color: #fff; border-color: var(--teal); }

    .item {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
      border-left-width: 5px;
    }
    .item .emoji { font-size: 26px; width: 34px; text-align: center; }
    .item .body { flex: 1; min-width: 0; }
    .item .name { font-weight: 700; font-size: 16px; }
    .item .meta { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
    .badge {
      display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 999px;
      padding: 3px 9px; margin-top: 6px;
    }
    .item .del { background: none; border: none; color: var(--line); font-size: 20px; cursor: pointer; padding: 6px; }
    .item .del:hover { color: var(--red); }

    .lv-red { border-left-color: var(--red); }
    .lv-red .badge { background: var(--red-soft); color: var(--red); }
    .lv-amber { border-left-color: var(--amber); }
    .lv-amber .badge { background: var(--amber-soft); color: var(--amber); }
    .lv-green { border-left-color: var(--green); }
    .lv-green .badge { background: var(--green-soft); color: var(--green); }

    .empty { text-align: center; color: var(--sub); padding: 48px 20px; font-size: 14px; }
    .empty .big { font-size: 40px; margin-bottom: 10px; }

    /* Bottom action bar */
    .actionbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 560px; display: flex; gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      z-index: 30;
    }
    .btn {
      flex: 1; border: none; border-radius: 14px; padding: 15px; font-size: 15px;
      font-weight: 700; cursor: pointer;
    }
    .btn-add { background: var(--teal); color: #fff; }
    .btn-cook { background: #fff; color: var(--teal); border: 1.5px solid var(--teal); }

    /* Sheet (modal) */
    .overlay {
      position: fixed; inset: 0; background: rgba(20,28,25,.45); z-index: 40;
      display: none; align-items: flex-end; justify-content: center;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 560px;
      border-radius: 22px 22px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
      max-height: 88vh; overflow-y: auto; animation: up .22s ease;
    }
    @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet h2 { font-size: 17px; margin: 0 0 16px; }
    .grab { width: 38px; height: 4px; background: var(--line); border-radius: 99px; margin: 0 auto 14px; }

    label { display: block; font-size: 12.5px; font-weight: 700; color: var(--sub); margin: 14px 0 6px; }
    input, select {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 13px;
      font-size: 16px; background: #fff; color: var(--ink); font-family: inherit;
    }
    input:focus, select:focus { outline: 2px solid var(--teal-soft); border-color: var(--teal); }
    .quick { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .quick button {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 8px 12px; font-size: 13px; cursor: pointer;
    }
    .quick button:active { background: var(--teal-soft); }
    .row2 { display: flex; gap: 10px; }
    .row2 > div { flex: 1; }
    .sheet .btn-add { width: 100%; margin-top: 22px; }
    .btn-photo {
      width: 100%; border: 1.5px dashed var(--teal); background: var(--teal-soft);
      color: var(--teal); border-radius: 14px; padding: 14px; font-size: 15px;
      font-weight: 700; cursor: pointer; margin-bottom: 4px;
    }
    .photo-loading { display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 13px; padding: 12px 2px; }
    .photo-loading .spinner { width: 18px; height: 18px; border-width: 2px; margin: 0; }
    .photo-ok { background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; margin-top: 8px; }
    .photo-err { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; margin-top: 8px; }
    .help { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.7; }
    .help a { color: var(--teal); }

    /* Recipe result */
    .recipe-box { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
    .recipe-box h3 { margin: 0 0 4px; font-size: 16px; color: var(--teal); }
    .recipe-box .uses { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
    .recipe-box p { margin: 6px 0; font-size: 14px; }
    .recipe-box ol, .recipe-box ul { margin: 6px 0; padding-left: 20px; font-size: 14px; }
    .recipe-box li { margin: 3px 0; }
    .loading { text-align: center; color: var(--sub); padding: 24px; font-size: 14px; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid var(--teal-soft); border-top-color: var(--teal);
      border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { background: var(--red-soft); color: var(--red); border-radius: 12px; padding: 12px; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1><span class="leaf">🌿</span> 冷蔵庫メモ</h1>
      <button class="gear" onclick="openSheet('settings')" aria-label="設定">⚙️</button>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <main>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </main>

  <div class="actionbar">
    <button class="btn btn-cook" onclick="openSheet('cook')">🍳 レシピ提案</button>
    <button class="btn btn-add" onclick="openSheet('add')">＋ 食材を追加</button>
  </div>

  <!-- Add sheet -->
  <div class="overlay" id="ov-add" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="grab"></div>
      <h2>食材を追加</h2>

      <button class="btn-photo" onclick="document.getElementById('f-photo').click()">📷 写真で読み取る</button>
      <input id="f-photo" type="file" accept="image/*" capture="environment" hidden onchange="readPhoto(event)">
      <div id="photo-status"></div>

      <label>食材の名前</label>
      <input id="f-name" placeholder="例：とり胸肉、牛乳、ほうれん草" autocomplete="off">
      <div class="quick" id="quick-names"></div>

      <div class="row2">
        <div>
          <label>数量・メモ（任意）</label>
          <input id="f-qty" placeholder="例：2パック" autocomplete="off">
        </div>
        <div>
          <label>分類</label>
          <select id="f-cat">
            <option value="🥬">🥬 野菜</option>
            <option value="🍖">🍖 肉</option>
            <option value="🐟">🐟 魚</option>
            <option value="🥛">🥛 乳・卵</option>
            <option value="🍱">🍱 惣菜・残り物</option>
            <option value="🧊">🧊 冷凍</option>
            <option value="🫙">🫙 調味料・その他</option>
          </select>
        </div>
      </div>

      <label>賞味期限</label>
      <input id="f-date" type="date">
      <div class="quick" id="quick-dates"></div>

      <button class="btn btn-add" onclick="saveItem()">この食材を登録</button>
    </div>
  </div>

  <!-- Cook sheet -->
  <div class="overlay" id="ov-cook" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="grab"></div>
      <h2>🍳 今日のレシピ提案</h2>
      <p class="help" style="margin-top:0">賞味期限が近い食材を優先して、AIが作れる料理を提案します。</p>
      <div id="cook-content"></div>
      <button class="btn btn-cook" id="cook-btn" onclick="suggestRecipes()" style="margin-top:16px">提案してもらう</button>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="overlay" id="ov-settings" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="grab"></div>
      <h2>⚙️ 設定</h2>

      <label>AIレシピのAPIキー（Anthropic）</label>
      <input id="f-key" type="password" placeholder="sk-ant-... で始まるキー" autocomplete="off">
      <p class="help">
        レシピ提案にはAnthropic（Claude）のAPIキーが必要です。<br>
        ① <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a> でキーを発行 →
        ② ここに貼り付け。<br>
        キーはこの端末の中だけに保存され、外部には送りません（Anthropic以外には）。
      </p>

      <label>AIの賢さ</label>
      <select id="f-model">
        <option value="claude-opus-4-8">高品質（おすすめ・少し割高）</option>
        <option value="claude-sonnet-4-6">標準（バランス）</option>
        <option value="claude-haiku-4-5">節約（速くて安い）</option>
      </select>

      <label>何日前から「期限が近い」とする？</label>
      <select id="f-warn">
        <option value="3">3日前</option>
        <option value="5">5日前</option>
        <option value="7">7日前</option>
      </select>

      <button class="btn btn-add" onclick="saveSettings()">保存</button>
      <p class="help" style="margin-top:18px">
        登録データはこの端末のブラウザに保存されます。アプリの削除やデータ消去で消えます。
      </p>
    </div>
  </div>

  <script>
    // ---------- データ ----------
    const KEY = 'fridge.items.v1';
    const CFG = 'fridge.config.v1';
    let items = load(KEY, []);
    let cfg = load(CFG, { apiKey: '', model: 'claude-opus-4-8', warnDays: 3 });
    let filter = 'all';

    function load(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } }
    function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

    // ---------- 期限計算 ----------
    function daysLeft(dateStr) {
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(dateStr + 'T00:00:00');
      return Math.round((d - today) / 86400000);
    }
    function level(dl) {
      if (dl < 0) return 'red';
      if (dl <= Number(cfg.warnDays)) return 'red';
      if (dl <= 7) return 'amber';
      return 'green';
    }
    function labelFor(dl) {
      if (dl < 0) return `${-dl}日 期限切れ`;
      if (dl === 0) return '今日まで';
      if (dl === 1) return 'あと1日';
      return `あと${dl}日`;
    }

    // ---------- 描画 ----------
    function render() {
      // summary
      const near = items.filter(i => daysLeft(i.date) <= Number(cfg.warnDays)).length;
      const sumEl = document.getElementById('summary');
      if (items.length === 0) sumEl.innerHTML = 'まだ食材がありません。下のボタンから追加しましょう。';
      else if (near > 0) sumEl.innerHTML = `登録 ${items.length} 件 ・ <b>期限が近い ${near} 件</b>`;
      else sumEl.innerHTML = `登録 ${items.length} 件 ・ 期限の近いものはありません 👍`;

      // filters
      const cats = ['all', ...new Set(items.map(i => i.cat))];
      const names = { all:'すべて', '🥬':'野菜', '🍖':'肉', '🐟':'魚', '🥛':'乳卵', '🍱':'惣菜', '🧊':'冷凍', '🫙':'その他' };
      document.getElementById('filters').innerHTML = cats.map(c =>
        `<button class="chip ${filter===c?'active':''}" onclick="setFilter('${c}')">${c==='all'?'すべて':c+' '+(names[c]||'')}</button>`
      ).join('');

      // list (sorted by date)
      const sorted = [...items].sort((a,b) => a.date.localeCompare(b.date));
      const shown = sorted.filter(i => filter==='all' || i.cat===filter);
      const listEl = document.getElementById('list');
      if (shown.length === 0) {
        listEl.innerHTML = `<div class="empty"><div class="big">🧺</div>食材がありません</div>`;
        return;
      }
      listEl.innerHTML = shown.map(i => {
        const dl = daysLeft(i.date);
        const lv = level(dl);
        const dateTxt = new Date(i.date+'T00:00:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
        return `<div class="item lv-${lv}">
          <div class="emoji">${i.cat}</div>
          <div class="body">
            <div class="name">${esc(i.name)}${i.qty?`<span class="meta"> ・ ${esc(i.qty)}</span>`:''}</div>
            <div class="meta">${dateTxt} まで</div>
            <span class="badge">${labelFor(dl)}</span>
          </div>
          <button class="del" onclick="delItem('${i.id}')" aria-label="削除">×</button>
        </div>`;
      }).join('');
    }
    function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function setFilter(c){ filter=c; render(); }

    // ---------- 追加・削除 ----------
    function saveItem() {
      const name = document.getElementById('f-name').value.trim();
      const date = document.getElementById('f-date').value;
      if (!name) { alert('食材の名前を入れてください'); return; }
      if (!date) { alert('賞味期限を選んでください'); return; }
      items.push({
        id: Date.now()+''+Math.floor(Math.random()*999),
        name,
        qty: document.getElementById('f-qty').value.trim(),
        cat: document.getElementById('f-cat').value,
        date
      });
      save(KEY, items);
      closeSheet();
      render();
    }
    function delItem(id) {
      items = items.filter(i => i.id !== id);
      save(KEY, items);
      render();
    }

    // ---------- クイック入力 ----------
    const QUICK_NAMES = ['とり胸肉','豚こま','牛乳','卵','ほうれん草','キャベツ','豆腐','納豆','ヨーグルト','鮭','玉ねぎ','にんじん'];
    const NAME_CAT = { 'とり胸肉':'🍖','豚こま':'🍖','牛乳':'🥛','卵':'🥛','ほうれん草':'🥬','キャベツ':'🥬','豆腐':'🫙','納豆':'🫙','ヨーグルト':'🥛','鮭':'🐟','玉ねぎ':'🥬','にんじん':'🥬' };
    function buildQuick() {
      document.getElementById('quick-names').innerHTML = QUICK_NAMES.map(n =>
        `<button onclick="pickName('${n}')">${n}</button>`).join('');
      const opts = [['今日',0],['3日後',3],['1週間後',7],['2週間後',14]];
      document.getElementById('quick-dates').innerHTML = opts.map(([t,d]) =>
        `<button onclick="pickDate(${d})">${t}</button>`).join('');
    }
    function pickName(n){
      document.getElementById('f-name').value = n;
      if (NAME_CAT[n]) document.getElementById('f-cat').value = NAME_CAT[n];
    }
    function pickDate(d){
      const dt = new Date(); dt.setDate(dt.getDate()+d);
      document.getElementById('f-date').value = dt.toISOString().slice(0,10);
    }

    // ---------- シート ----------
    function openSheet(which) {
      if (which === 'add') {
        document.getElementById('f-name').value = '';
        document.getElementById('f-qty').value = '';
        document.getElementById('f-date').value = '';
        document.getElementById('f-cat').value = '🥬';
        document.getElementById('photo-status').innerHTML = '';
      }
      if (which === 'settings') {
        document.getElementById('f-key').value = cfg.apiKey || '';
        document.getElementById('f-model').value = cfg.model;
        document.getElementById('f-warn').value = cfg.warnDays;
      }
      if (which === 'cook') {
        document.getElementById('cook-content').innerHTML = '';
        document.getElementById('cook-btn').style.display = 'block';
      }
      document.getElementById('ov-'+which).classList.add('open');
    }
    function closeSheet() {
      document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
    }
    function saveSettings() {
      cfg.apiKey = document.getElementById('f-key').value.trim();
      cfg.model = document.getElementById('f-model').value;
      cfg.warnDays = document.getElementById('f-warn').value;
      save(CFG, cfg);
      closeSheet();
      render();
    }

    // ---------- AIレシピ ----------
    async function suggestRecipes() {
      const box = document.getElementById('cook-content');
      const btn = document.getElementById('cook-btn');
      if (!cfg.apiKey) {
        box.innerHTML = `<div class="err">APIキーが未設定です。右上の⚙️設定からAnthropicのAPIキーを登録してください。</div>`;
        return;
      }
      if (items.length === 0) {
        box.innerHTML = `<div class="err">先に食材を登録してください。</div>`;
        return;
      }
      btn.style.display = 'none';
      box.innerHTML = `<div class="loading"><div class="spinner"></div>AIが献立を考えています…</div>`;

      // 期限が近い順に最大10件を渡す
      const sorted = [...items].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);
      const listText = sorted.map(i => {
        const dl = daysLeft(i.date);
        return `- ${i.name}${i.qty?`（${i.qty}）`:''}：${labelFor(dl)}`;
      }).join('\n');

      const prompt = `あなたは家庭料理が得意なシェフです。下の冷蔵庫の食材から、今日作れる料理を2〜3品提案してください。
賞味期限が近い食材を優先的に使い切ることを最重視してください。
足りない調味料や定番食材（米・油・塩・醤油など）は家にある前提で構いません。

【冷蔵庫の食材（上ほど期限が近い）】
${listText}

【出力形式】必ず次のJSONだけを返してください。前後に説明文やマークダウンの記号は付けないこと。
{"recipes":[{"name":"料理名","uses":["使う食材","使う食材"],"time":"およそ◯分","steps":["手順1","手順2","手順3"]}]}`;

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-api-key': cfg.apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: cfg.model,
            max_tokens: 2000,
            messages: [{ role: 'user', content: prompt }]
          })
        });
        if (!res.ok) {
          const t = await res.text();
          let msg = `エラー（${res.status}）`;
          if (res.status === 401) msg = 'APIキーが正しくないようです。設定を確認してください。';
          else if (res.status === 429) msg = '少し混み合っています。時間をおいて再度お試しください。';
          else if (res.status === 400 && t.includes('credit')) msg = 'Anthropicの残高が不足している可能性があります。';
          box.innerHTML = `<div class="err">${msg}</div>`;
          btn.style.display = 'block'; btn.textContent = 'もう一度試す';
          return;
        }
        const data = await res.json();
        const text = (data.content || []).filter(b => b.type==='text').map(b => b.text).join('');
        renderRecipes(text, box);
      } catch (e) {
        box.innerHTML = `<div class="err">通信に失敗しました。ネット接続を確認してください。</div>`;
        btn.style.display = 'block'; btn.textContent = 'もう一度試す';
      }
      btn.textContent = '別の提案をもらう';
      btn.style.display = 'block';
    }

    function renderRecipes(text, box) {
      let parsed;
      try {
        const m = text.match(/\{[\s\S]*\}/);
        parsed = JSON.parse(m ? m[0] : text);
      } catch {
        box.innerHTML = `<div class="recipe-box"><p>${esc(text)}</p></div>`;
        return;
      }
      const recipes = parsed.recipes || [];
      if (!recipes.length) { box.innerHTML = `<div class="err">提案が得られませんでした。もう一度お試しください。</div>`; return; }
      box.innerHTML = recipes.map(r => `
        <div class="recipe-box">
          <h3>${esc(r.name||'料理')}</h3>
          <div class="uses">使う食材：${(r.uses||[]).map(esc).join('、')}${r.time?` ・ ${esc(r.time)}`:''}</div>
          <ol>${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
        </div>`).join('');
    }

    // ---------- 写真で読み取り（画像認識） ----------
    async function readPhoto(ev) {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = ''; // 同じ写真を再選択できるように
      if (!file) return;
      const status = document.getElementById('photo-status');
      if (!cfg.apiKey) {
        status.innerHTML = `<div class="photo-err">写真の読み取りにもAPIキーが必要です。右上⚙️から登録してください。</div>`;
        return;
      }
      status.innerHTML = `<div class="photo-loading"><div class="spinner"></div>写真を読み取っています…</div>`;
      try {
        const { data, media } = await shrinkImage(file);
        const today = new Date().toISOString().slice(0,10);
        const prompt = `この写真は食品か、その賞味期限／消費期限のラベルです。読み取って次のJSONだけを返してください（説明文や記号は付けない）。
今日は ${today} です。
- name: 食品名（短く。読めなければ写真から推測。例「牛乳」「とり胸肉」）
- date: 賞味期限または消費期限を YYYY-MM-DD で。年が書かれていなければ今日以降で最も近い日付として補完。日付が全く読めなければ空文字 ""。
- cat: 次から1つの絵文字 🥬(野菜) 🍖(肉) 🐟(魚) 🥛(乳卵) 🍱(惣菜) 🧊(冷凍) 🫙(調味料その他)
出力例: {"name":"牛乳","date":"2026-06-20","cat":"🥛"}`;
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-api-key': cfg.apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: cfg.model,
            max_tokens: 400,
            messages: [{ role: 'user', content: [
              { type: 'image', source: { type: 'base64', media_type: media, data } },
              { type: 'text', text: prompt }
            ]}]
          })
        });
        if (!res.ok) {
          let msg = `読み取りに失敗しました（${res.status}）`;
          if (res.status === 401) msg = 'APIキーが正しくないようです。設定を確認してください。';
          else if (res.status === 429) msg = '混み合っています。少し待って再度お試しください。';
          status.innerHTML = `<div class="photo-err">${msg}</div>`;
          return;
        }
        const out = await res.json();
        const text = (out.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
        const m = text.match(/\{[\s\S]*\}/);
        const r = JSON.parse(m ? m[0] : text);
        if (r.name) document.getElementById('f-name').value = r.name;
        if (r.cat) document.getElementById('f-cat').value = r.cat;
        if (r.date) document.getElementById('f-date').value = r.date;
        if (r.date) {
          status.innerHTML = `<div class="photo-ok">読み取り完了：${esc(r.name||'')} ・ 期限 ${esc(r.date)}。内容を確認して登録してください。</div>`;
        } else {
          status.innerHTML = `<div class="photo-err">期限の日付が読み取れませんでした。明るく・大きめに撮るか、手入力してください。</div>`;
        }
      } catch (e) {
        status.innerHTML = `<div class="photo-err">読み取りに失敗しました。もう一度撮影するか、手入力してください。</div>`;
      }
    }

    // 写真をcanvasで縮小してbase64化（通信量とAI料金を抑える）
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const max = 1400;
          let { width:w, height:h } = img;
          if (w > max || h > max) { const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = c.toDataURL('image/jpeg', 0.8);
          resolve({ data: dataUrl.split(',')[1], media: 'image/jpeg' });
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
        img.src = url;
      });
    }

    // ---------- 起動 ----------
    buildQuick();
    render();
  </script>
</body>
</html>
