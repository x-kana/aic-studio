<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お茶の淹れ方タイマー｜かおりちゃん・宇治森徳</title>
<meta name="description" content="このお茶に合った湯温・茶葉の量・抽出時間。タップで動くタイマーつき。アプリは要りません。">
<meta name="theme-color" content="#2E4636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="お茶タイマー">
<style>
:root{
  --paper:#F6F4ED; --card:#FFFDF7; --ink:#1F211E; --ink-2:#4C504A; --muted:#8A8C83;
  --green:#2E4636; --green-l:#4A6B54; --accent:#9C6B3F; --line:#DFDACB; --line-2:#EBE7DB;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.85;-webkit-font-smoothing:antialiased;letter-spacing:.02em;
  transition:background .6s,color .6s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(120,110,85,.055) 1px,transparent 1px);background-size:3px 3px}
body.done{background:var(--green);color:#EFEDE4}
body.done::before{opacity:.25}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;
  padding:0 22px calc(48px + env(safe-area-inset-bottom));min-height:100vh}
.screen{display:none}
.screen.on{display:block;animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.small{font-size:11.5px;letter-spacing:.14em;color:var(--muted)}

/* ── 商品選択 ── */
.pickhead{padding-top:9vh;text-align:center;margin-bottom:34px}
.brand{font-size:10.5px;letter-spacing:.42em;color:var(--muted);margin-bottom:26px}
.pickhead h1{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.5;
  letter-spacing:.18em;margin:0 0 10px;text-indent:.18em;color:var(--green)}
.pickhead p{margin:0;font-size:13px;color:var(--ink-2);line-height:2}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);background:var(--card);
  font-family:var(--sans);font-size:15px;color:var(--ink);margin-bottom:4px}
.search:focus{outline:none;border-color:var(--green-l)}
.plist{max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line-2)}
.pcat{font-family:var(--serif);font-size:11.5px;letter-spacing:.22em;color:var(--accent);
  padding:18px 0 6px;border-bottom:1px solid var(--line-2)}
.pitem{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line-2);padding:14px 26px 14px 2px;cursor:pointer;position:relative;
  font-family:var(--sans);font-size:14.5px;color:var(--ink);transition:padding-left .2s,color .2s}
.pitem small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.pitem::after{content:"";position:absolute;right:6px;top:50%;width:6px;height:6px;
  border-right:1px solid var(--line);border-top:1px solid var(--line);
  transform:translateY(-50%) rotate(45deg);transition:.2s}
.pitem:hover{padding-left:12px;color:var(--green)}
.pitem:hover::after{border-color:var(--accent);right:2px}
.hint{margin-top:22px;font-size:11.5px;line-height:1.95;color:var(--muted);text-align:center}

/* ── タイマー ── */
.thead{padding-top:34px;text-align:center}
.tcat{font-family:var(--serif);font-size:11.5px;letter-spacing:.24em;color:var(--accent);margin:0 0 8px;text-indent:.24em}
body.done .tcat{color:#B9C7B8}
.tname{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.5;
  letter-spacing:.05em;margin:0;color:var(--green)}
body.done .tname{color:#EFEDE4}
body.done .change{color:#9FB2A0}
.change{background:none;border:0;margin-top:10px;color:var(--muted);font-size:11.5px;
  letter-spacing:.1em;cursor:pointer;font-family:var(--sans);text-decoration:underline;text-underline-offset:4px}

.steps{display:flex;gap:0;margin:26px 0 6px;border-bottom:1px solid var(--line)}
body.done .steps{border-color:rgba(239,237,228,.3)}
.step{flex:1;background:none;border:0;padding:11px 4px;cursor:pointer;position:relative;
  font-family:var(--sans);font-size:12.5px;letter-spacing:.1em;color:var(--muted);transition:color .2s}
.step.on{color:var(--green)}
body.done .step{color:#9FB2A0} body.done .step.on{color:#EFEDE4}
.step.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}

.dialwrap{display:flex;justify-content:center;margin:30px 0 4px}
.dial{position:relative;width:min(280px,72vw);aspect-ratio:1}
.dial svg{transform:rotate(-90deg);display:block;width:100%;height:100%}
.dial circle{fill:none;stroke-width:1.5}
.dial .tr{stroke:var(--line)}
body.done .dial .tr{stroke:rgba(239,237,228,.25)}
.dial .pg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.dial .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tval{font-family:var(--serif);font-weight:400;font-size:min(62px,16vw);letter-spacing:.02em;
  color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
body.done .tval{color:#EFEDE4}
.tsub{margin-top:12px;font-size:11.5px;letter-spacing:.16em;color:var(--muted)}
body.done .tsub{color:#B9C7B8}

.specs{display:flex;text-align:center;margin:22px 0 26px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
body.done .specs{border-color:rgba(239,237,228,.22)}
.specs div{flex:1;padding:16px 6px;min-width:0}
.specs div+div{border-left:1px solid var(--line-2)}
body.done .specs div+div{border-color:rgba(239,237,228,.22)}
.specs span{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:6px}
body.done .specs span{color:#9FB2A0}
.specs b{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--green);letter-spacing:.02em}
body.done .specs b{color:#EFEDE4}

.ctrl{display:flex;gap:10px}
.cbtn{flex:1;padding:17px 0;border:1px solid var(--line);background:transparent;color:var(--green);
  font-family:var(--serif);font-size:15px;letter-spacing:.24em;text-indent:.24em;cursor:pointer;transition:.2s}
.cbtn:hover{background:#EFEDE4}
.cbtn.pri{flex:2;background:var(--green);border-color:var(--green);color:#F6F4ED}
.cbtn.pri:hover{background:#25392B}
body.done .cbtn{border-color:rgba(239,237,228,.4);color:#EFEDE4}
body.done .cbtn:hover{background:rgba(239,237,228,.12)}
body.done .cbtn.pri{background:#EFEDE4;border-color:#EFEDE4;color:var(--green)}

.voice{margin-top:30px;padding:20px 22px;background:#EFEDE2;border-left:2px solid var(--green-l)}
.voice p{margin:0;font-family:var(--serif);font-size:14px;line-height:2.05}
.voice cite{display:block;margin-top:12px;font-style:normal;font-size:11px;letter-spacing:.12em;color:var(--muted)}
body.done .voice{display:none}

.donepanel{display:none;margin-top:34px;text-align:center}
body.done .donepanel{display:block;animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
.donepanel h3{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.14em;margin:0 0 6px;text-indent:.14em}
.donepanel p{margin:0 0 22px;font-size:13px;line-height:2.05;color:#CFD8CB}
.lbtn{display:block;padding:17px;background:#EFEDE4;color:var(--green);text-decoration:none;
  font-family:var(--serif);font-size:15px;letter-spacing:.16em;text-indent:.16em;transition:.2s}
.lbtn:hover{background:#fff}
.lbtn2{display:block;margin-top:10px;padding:14px;border:1px solid rgba(239,237,228,.35);
  color:#EFEDE4;text-decoration:none;font-size:12.5px;letter-spacing:.16em;transition:.2s}
.lbtn2:hover{border-color:#EFEDE4}
.foot{margin-top:30px;text-align:center;font-size:10.5px;letter-spacing:.16em;color:#B4B2A6;line-height:1.9}
body.done .foot{color:rgba(239,237,228,.5)}
</style>
</head>
<body>
<div class="wrap">

<section class="screen on" id="s-pick">
  <div class="pickhead">
    <div class="brand">KAORICHAN / UJIMORITOKU</div>
    <h1>お茶の淹れ方</h1>

  <div class="foot" id="t-foot"></div>
</section>
</div>

}

    $("t-ctrl").style.display="flex";
    $("t-go").textContent="はじめる";
    $("t-sub").textContent=long_(s.s)?"冷蔵庫に入れて、待ちます":"湯を注いだら、はじめる";
  }
}
function long_(sec){return sec>=900}          // 15分以上は「飲みごろ時刻」で見せる
function fmt(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h? h+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2) : m+":"+("0"+s).slice(-2);
}
function paint(){
  var tot=brewData.steps[stepIdx].s;
  $("t-val").textContent=tot?fmt(remain):"—";
  $("ring").setAttribute("stroke-dashoffset",tot?CIRC*(1-remain/tot):0);
}
function toggle(){
  if(running){ // 一時停止
    remain=(endAt-Date.now())/1000; stop(); $("t-go").textContent="つづける";
    $("t-sub").textContent="止めています"; return;
  }
  if(remain<=0) remain=brewData.steps[stepIdx].s;
  unlockAudio(); keepAwake();
  endAt=Date.now()+remain*1000; running=true;
  $("t-go").textContent="とめる";
  var s=brewData.steps[stepIdx];
  $("t-sub").textContent=long_(s.s)
    ? "飲みごろ "+new Date(endAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+" ごろ"
    : "抽出中";
  tick=setInterval(update,200); update();
}
function update(){
  remain=(endAt-Date.now())/1000;
  if(remain<=0){remain=0;paint();finish();return}
  paint();
}
function stop(){clearInterval(tick);tick=null;running=false;releaseWake()}
function reset(){stop();document.body.classList.remove("done");selectStep(stepIdx)}
function finish(){
  stop(); document.body.classList.add("done");
  $("t-val").textContent="どうぞ";
  $("t-sub").textContent=brewData.steps[stepIdx].l+"、できあがりです";
  $("t-go").textContent="もう一度";
  chime(); if(navigator.vibrate) navigator.vibrate([140,90,140,90,240]);
}

/* 画面を消させない（対応端末のみ・失敗しても動作に影響なし） */
function keepAwake(){ try{ if("wakeLock" in navigator)
  navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){}); }catch(e){} }
function releaseWake(){ try{ if(wake){wake.release();wake=null} }catch(e){} }
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){ if(running){update();keepAwake()} }
});

/* 完了音（音源ファイルを持たず、その場で鳴らす） */
function unlockAudio(){ try{ if(!audio){var C=window.AudioContext||window.webkitAudioContext;
  if(C){audio=new C()}} if(audio&&audio.state==="suspended")audio.resume(); }catch(e){} }
function chime(){ try{ if(!audio)return;
  [0,0.42,0.84].forEach(function(t,i){
    var o=audio.createOscillator(),g=audio.createGain(),s=audio.currentTime+t;
    o.type="sine"; o.frequency.setValueAtTime(i===2?1046.5:783.99,s);
    g.gain.setValueAtTime(0.0001,s);
    g.gain.exponentialRampToValueAtTime(0.28,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,s+0.36);
    o.connect(g);g.connect(audio.destination);o.start(s);o.stop(s+0.4);
  }); }catch(e){} }

function line(){
  alert("LINE公式アカウントの友だち追加へ遷移します。\n（QR "+(LOT||"未指定")+" / 商品 "+prod.n+" を引き継ぎます）");
  return false;
}

/* ═══ 起動 ═══
   QRの ?t=（ロット）や ?p=（JAN）があれば、その商品のタイマーを直接ひらく */
(function(){
  var jan=params.get("p");
  if(!jan&&LOT){ // ロットコードの先頭1文字＝商品コード。実運用では対応表に置き換える
    var m=PRODUCTS.filter(function(p){return p.j.slice(-4)===LOT.slice(-4)})[0];
    if(m) jan=m.j;
  }
  if(jan&&PRODUCTS.some(function(p){return p.j===jan})){ open_(jan); }
  else { renderList(); }
  window.__teaTimer={lot:LOT};
})();
</script>
